[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airwell-tfh-modbus"
version = "0.1.0"
description = "Read and control an Airwell TFHA/TFHW/TFHX/TFHZ heat pump water heater over Modbus."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "airwell-tfh-modbus contributors" }]
keywords = [
  "modbus",
  "airwell",
  "heat-pump",
  "water-heater",
  "tfha",
  "tfhw",
  "tfhx",
  "tfhz",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = ["modbus-connection>=4.10.0"]

[project.urls]
Homepage = "https://github.com/mjvanderveen/airwell_tfh_modbus"
Issues = "https://github.com/mjvanderveen/airwell_tfh_modbus/issues"

[project.optional-dependencies]
tmodbus = ["modbus-connection[tmodbus]>=4.10.0"]
pymodbus = ["modbus-connection[pymodbus]>=4.10.0"]

[dependency-groups]
dev = [
  "modbus-connection[testing]",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.15.0",
  "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airwell_tfh_modbus"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # one-blank-line-before-class: conflicts with D211
  "D212",   # multi-line-summary-first-line: pick D213 style below
  "D213",   # multi-line-summary-second-line: code uses first-line summaries
  "COM812", # trailing-comma-missing: conflicts with the formatter
  "CPY001", # missing-copyright-notice: not required for this project
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D103", "D401", "ANN001", "ANN201", "INP001", "PLR2004"]
"script/**" = ["INP001", "T201"]
# Package-internal relative imports keep the library import-portable.
"src/**" = ["TID252"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
