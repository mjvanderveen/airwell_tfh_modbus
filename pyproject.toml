[tool.ruff]
target-version = "py313"
line-length = 100
# The library has its own nested pyproject.toml; the core-integration draft has
# none and isn't meant to be enforced by this repo's own lint job.
extend-exclude = ["library", "core-integration-draft"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # one-blank-line-before-class: conflicts with D211
  "D212",   # multi-line-summary-first-line: pick D213 style below
  "D213",   # multi-line-summary-second-line: code uses first-line summaries
  "COM812", # trailing-comma-missing: conflicts with the formatter
  "CPY001", # missing-copyright-notice: not used in Home Assistant integrations
  "ANN401", # any-type: **kwargs: Any is the standard Home Assistant idiom
  "FBT003", # boolean-positional-value: register values are data, not flags
]

[tool.ruff.lint.per-file-ignores]
# The vendored library keeps its own relative imports so it stays portable.
"custom_components/airwell_tfh/airwell_tfh_modbus/**" = ["D401", "TID252"]
