name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOMAIN: airwell_tfh

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag
        run: |
          manifest_version=$(jq -r .version "custom_components/${DOMAIN}/manifest.json")
          if [ "$manifest_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::manifest.json version ($manifest_version) does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Build integration zip
        run: |
          cd "custom_components/${DOMAIN}"
          zip -r "${GITHUB_WORKSPACE}/${DOMAIN}.zip" . -x '*.pyc' -x '*/__pycache__/*'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${DOMAIN}.zip" --generate-notes
