name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install --requirement requirements_common.txt
      - run: python3 -m pip install --requirement requirements_lint.txt
      - run: ruff format --check .
      - run: ruff check .
