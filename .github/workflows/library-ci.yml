name: Library CI

on:
  push:
    branches: [main]
    paths: ["library/**", ".github/workflows/library-ci.yml"]
  pull_request:
    paths: ["library/**", ".github/workflows/library-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: library

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.15.21
      - run: ruff format --check .
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[tmodbus]"
      - run: python -m pip install --group dev
      - run: pytest

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[tmodbus]"
      - run: python -m pip install --group dev
      - run: mypy src
