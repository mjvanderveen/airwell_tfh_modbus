name: Library — Publish to PyPI

on:
  push:
    tags:
      - "lib-v*"

defaults:
  run:
    working-directory: library

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify pyproject version matches tag
        run: |
          pyproject_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$pyproject_version" != "${GITHUB_REF_NAME#lib-v}" ]; then
            echo "::error::library version ($pyproject_version) does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: library/dist
